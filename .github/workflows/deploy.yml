name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: 67f535607ef17737aff7f5da1a551e25
          # --skip-caching：禁用「已上传文件跳过」优化，每次全量上传。
          # 代价：部署慢几秒（315 文件约 8s vs 0.5s）。
          # 收益：避免 hash 复用导致新文件未真正上传的诡异情况
          #       （2026-11-25 遇到过 Uploaded 0 files，排查成本远大于几秒）。
          command: pages deploy dist --project-name zhangzhongze --skip-caching
